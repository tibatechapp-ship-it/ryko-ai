name: Ryko CI

on:
  push:
  workflow_dispatch:

jobs:
  trust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "1) Demo - run without any install"
        run: python -m ryko.cli demo

      - name: "2) Verify - hash chain intact"
        run: python -m ryko.cli verify

      - name: "3) Audit - must catch the planted lie (exit 1)"
        shell: bash
        run: |
          set +e
          python -m ryko.cli audit
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "✘ المتوقع خروج 1 (كشف الكذبة)، وصل: $code"
            exit 1
          fi
          echo "✔ المدقق كشف الكذبة المزروعة كما صُمم"
