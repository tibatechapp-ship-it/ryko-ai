[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ryko-ai"
version = "0.0.1"
description = "Ryko AI — Agent Trust Layer (Arabic-first)"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
ryko = "ryko.cli:main"

[tool.setuptools]
packages = ["ryko"]
